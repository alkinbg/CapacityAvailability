name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. For potential security vulnerabilities,
        please use the private channel described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Core calculator
        - Doctrine DBAL adapter
        - Documentation or examples
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include capacity intervals, bookings, query and exact inputs. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP, Doctrine DBAL and MariaDB versions when relevant
    validations:
      required: false
