name: PHP CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    unit:
        name: "Unit tests / PHP ${{ matrix.php }}"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, dom, xml, pdo_mysql
                  coverage: none
            - run: composer validate --strict --no-check-publish
            - run: composer install --no-interaction --no-progress --prefer-dist
            - run: composer test
            - run: composer test:reference

    analysis:
        name: PHPStan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - run: composer install --no-interaction --no-progress --prefer-dist
            - run: composer analyse

    mariadb:
        name: MariaDB transactional booking
        runs-on: ubuntu-latest
        services:
            database:
                image: mariadb:11.3.2
                env:
                    MARIADB_ROOT_PASSWORD: ci-only-root
                    MARIADB_DATABASE: capacity_lib_test
                    MARIADB_USER: capacity_app
                    MARIADB_PASSWORD: ci-only-integration
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        env:
            CAPACITY_DB_ISOLATED: 'yes'
            CAPACITY_DB_PORT: '3306'
            CAPACITY_DB_PASSWORD: ci-only-integration
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql, mbstring, dom
                  coverage: none
            - run: composer install --no-interaction --no-progress --prefer-dist
            - run: php tests/Integration/setup.php
            - run: php tests/Integration/concurrent_mariadb.php
